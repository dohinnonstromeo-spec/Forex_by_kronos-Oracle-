name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Syntax check server and scripts
        run: |
          node --check server.mjs
          for f in scripts/*.mjs; do
            echo "checking $f"
            node --check "$f"
          done

      # No API keys are configured in CI on purpose: this exercises the exact
      # no-credentials fallback path (static prices, deterministic analysis
      # text, vision disabled) that a fresh clone or a degraded production
      # environment hits, so a crash here means a real crash for users too.
      - name: Boot smoke test (no API keys configured)
        run: |
          PORT=4174 node server.mjs > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4174/ > /dev/null 2>&1; then READY=1; break; fi
            sleep 0.5
          done
          if [ "$READY" != "1" ]; then
            echo "::error::Server never became ready within 20s. Last server output: $(tail -c 1200 /tmp/server.log | tr '\n' ' ')"
            kill "$SERVER_PID" 2>/dev/null
            exit 1
          fi
          # -f alone discards the response body and status on failure, which made
          # every past CI failure on this step a dead end (just "did not respond",
          # no HTTP status, no error body). GitHub Actions runs this script with
          # `bash -eo pipefail` -- a bare `status=$(curl ...)` with no fallback
          # aborts the whole step the instant curl itself fails (e.g. connection
          # refused, curl exit 7), bypassing fail() entirely and reporting nothing
          # but a raw curl exit code -- exactly what happened here twice. The `||
          # echo "000"` neutralizes that so fail() always actually runs and reports
          # both the real HTTP status/body and the server's own log tail through a
          # GitHub Actions error annotation, which is readable from the run/check-run
          # summary even without opening the full raw log.
          fail() {
            echo "::error::$1 failed -- HTTP ${2:-none} -- body: $(printf '%s' "$3" | head -c 600) -- server log tail: $(tail -c 600 /tmp/server.log | tr '\n' ' ')"
            kill "$SERVER_PID" 2>/dev/null
            exit 1
          }
          check() {
            local name="$1" url="$2"; shift 2
            local status body
            status=$(curl -s -o /tmp/smoke_body -w "%{http_code}" "$url" "$@" || echo "000")
            body=$(cat /tmp/smoke_body 2>/dev/null || echo "")
            [ "$status" = "200" ] || fail "$name" "$status" "$body"
            echo "$name OK"
          }
          check "Homepage" "http://127.0.0.1:4174/"
          check "/api/health" "http://127.0.0.1:4174/api/health"
          check "/api/signals" "http://127.0.0.1:4174/api/signals"
          check "/api/analyze-chart" "http://127.0.0.1:4174/api/analyze-chart" \
            -X POST -H "Content-Type: application/json" \
            -d '{"pair":"EUR/USD","timeframe":"H1","style":"Mixte","strategy":"Swing Trading","analysisDepth":"Rapide"}'
          kill $SERVER_PID
          echo "Smoke test passed."

      # Integration tests for auth/quota/rate-limit/admin -- the smoke test above only
      # checks the server boots and a handful of endpoints respond, it never exercises
      # signup, login, quotas, rate-limiting, or admin auth. Two real bugs shipped in
      # this exact surface with zero automated coverage catching either (a quota
      # bypass, and a signup path that skipped the login rate limiter). No secret.dev
      # in CI on purpose (same reasoning as the smoke test above) -- tests that need
      # ADMIN_TOKEN/TEST_MODE_TOKEN self-skip via the hasSecrets guard in the test
      # file rather than false-failing on an environment that was never supposed to
      # have them; the rest (signup validation, login rejection, password-reset
      # enumeration safety) still run for real.
      - name: Auth/quota/admin integration tests
        run: node --test scripts/api-tests.mjs
