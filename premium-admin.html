<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accès Premium manuel · Oracle Forex</title>
  <meta name="description" content="Outil interne Oracle Forex pour activer ou révoquer l'accès Premium manuel d'un compte.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/assets/styles-nTlncI0E.css">
  <link rel="stylesheet" href="/assets/oracle-extras.css">
</head>
<body class="oracle-page auth-page">
  <nav class="oracle-nav">
    <div class="oracle-nav-inner">
      <a href="/" class="oracle-brand">
        <span class="oracle-logo">O</span>
        <span>ORACLE <span class="text-amber-neon">FOREX</span></span>
      </a>
      <div class="oracle-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/admin-health">Santé API</a>
      </div>
    </div>
  </nav>

  <main class="oracle-main auth-main">
    <section class="auth-card premium-admin-card">
      <p class="analysis-kicker">Administration</p>
      <h1 class="analysis-title">Accès Premium manuel</h1>
      <p class="analysis-subtitle">Donne Premium à un testeur sans passer par le paiement. La personne doit d'abord créer un compte.</p>

      <form class="auth-form" data-premium-admin-form>
        <label>
          Token admin
          <input name="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="off" required>
        </label>
        <label>
          Email du compte
          <input name="email" type="email" placeholder="testeur@email.com" autocomplete="email" required>
        </label>
        <label>
          Durée Premium
          <input name="days" type="number" min="1" max="730" value="30" required>
        </label>
        <button class="analysis-submit" type="submit">Activer Premium</button>
      </form>

      <div class="auth-message" data-premium-admin-message></div>
      <div class="premium-admin-actions">
        <button type="button" data-load-members>Voir les derniers comptes</button>
      </div>
      <div class="dashboard-history" data-premium-members></div>
    </section>
  </main>

  <footer class="oracle-footer-lite">
    © 2026 Oracle Forex · Outil interne · <a href="mailto:vdohinnon22@gmail.com">Contact</a>.
  </footer>

  <script src="/assets/premium-admin.js" defer></script>
</body>
</html>
